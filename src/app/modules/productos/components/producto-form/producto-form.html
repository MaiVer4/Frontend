<div *ngIf="isVisible" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-header">
      <div>
        <h2>{{ producto?.codigo ? 'Editar producto' : 'Nuevo producto' }}</h2>
        <p>Completa los datos para guardar el producto.</p>
      </div>
      <button type="button" class="modal-close" (click)="cancelar()" aria-label="Cerrar">×</button>
    </div>

    <form [formGroup]="productoForm" (ngSubmit)="guardar()" class="modal-form">
      <div class="form-row">
        <label>
          Código
          <input type="text" formControlName="codigo" placeholder="Ej: PROD-001" />
          <span class="error-message" *ngIf="isFieldInvalid('codigo')">
            {{ getErrorMessage('codigo') }}
          </span>
        </label>
        <label>
          Nombre
          <input type="text" formControlName="nombre" placeholder="Nombre del producto" />
          <span class="error-message" *ngIf="isFieldInvalid('nombre')">
            {{ getErrorMessage('nombre') }}
          </span>
        </label>
      </div>

      <label class="full-width">
        Descripción
        <textarea formControlName="descripcion" rows="3" placeholder="Descripción breve"></textarea>
        <span class="error-message" *ngIf="isFieldInvalid('descripcion')">
          {{ getErrorMessage('descripcion') }}
        </span>
      </label>

      <label class="full-width">
        URL de la Imagen
        <input type="text" formControlName="imagenUrl" placeholder="https://..." />
        <span class="error-message" *ngIf="isFieldInvalid('imagenUrl')">
          {{ getErrorMessage('imagenUrl') }}
        </span>
      </label>

      <div class="form-row">
        <label>
          Precio ($)
          <input type="number" formControlName="precio" min="0" step="0.01" />
          <span class="error-message" *ngIf="isFieldInvalid('precio')">
            {{ getErrorMessage('precio') }}
          </span>
        </label>
        <label>
          Cantidad
          <input type="number" formControlName="cantidad" min="0" />
          <span class="error-message" *ngIf="isFieldInvalid('cantidad')">
            {{ getErrorMessage('cantidad') }}
          </span>
        </label>
      </div>

      <label class="full-width">
        Estado
        <select formControlName="estado">
          <option value="ACTIVO">ACTIVO</option>
          <option value="INACTIVO">INACTIVO</option>
        </select>
        <span class="error-message" *ngIf="isFieldInvalid('estado')">
          {{ getErrorMessage('estado') }}
        </span>
      </label>

      <div class="form-actions">
        <button type="button" class="button button-secondary" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="button button-primary" [disabled]="productoForm.invalid">{{ producto?.codigo ? 'Actualizar' : 'Crear' }}</button>
      </div>
    </form>
  </div>
</div>
